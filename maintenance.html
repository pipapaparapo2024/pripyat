<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Технический перерыв — Припять</title>
<style>
    * { box-sizing: border-box; }
    html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: #14120f;
        font-family: 'Arial Narrow', Arial, sans-serif;
        color: #e8d9bf;
        display: flex; align-items: center; justify-content: center;
        overflow: hidden;
    }
    .wrap {
        max-width: 560px;
        padding: 40px 32px;
        text-align: center;
    }
    .sign {
        font-size: 64px;
        line-height: 1;
        margin-bottom: 18px;
        filter: drop-shadow(0 0 14px rgba(230, 160, 40, 0.45));
    }
    h1 {
        margin: 0 0 14px;
        font-size: 26px;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: #e6a028;
        text-shadow: 0 1px 0 #000;
    }
    p {
        margin: 0 0 8px;
        font-size: 16px;
        line-height: 1.5;
        color: #cbbfa6;
    }
    .sub {
        font-size: 13px;
        color: #7a7064;
        margin-top: 22px;
    }
    .bar {
        margin: 26px auto 0;
        width: 220px;
        height: 4px;
        border-radius: 2px;
        background: #2a251e;
        overflow: hidden;
        position: relative;
    }
    .bar::after {
        content: '';
        position: absolute;
        top: 0; left: -40%;
        width: 40%; height: 100%;
        background: #e6a028;
        animation: slide 1.6s ease-in-out infinite;
    }
    @keyframes slide {
        0%   { left: -40%; }
        100% { left: 100%; }
    }
</style>
</head>
<body>
    <div class="wrap">
        <div class="sign">&#9762;</div>
        <h1>Идут технические работы</h1>
        <p>Зона временно закрыта на обслуживание.</p>
        <p>Скоро всё снова заработает — попробуйте зайти чуть позже.</p>
        <div class="bar"></div>
        <div class="sub">Припять</div>
    </div>
    <script src="./libs/browser.min.js"></script>
    <script>
        try {
            if (window.vkBridge) {
                vkBridge.send('VKWebAppInit').catch(function(){});
            }
        } catch (e) {}
    </script>
</body>
</html>
