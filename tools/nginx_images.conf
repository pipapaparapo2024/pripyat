# Отдача картинок: WebP по Accept + долгий кэш.  28.09.2026, оптимизация под мобильные.
# НЕ ПРИМЕНЕНО НА СЕРВЕРЕ — применять по явной команде.
#
# Что чинит:
#   1) Сейчас картинки отдаются с "Cache-Control: no-cache" (проверено HEAD-запросом к
#      pripyat-game.ru). ETag/Last-Modified есть, поэтому тело не перекачивается — но браузер
#      всё равно делает отдельный условный запрос на КАЖДЫЙ из 400+ файлов прелоада при каждом
#      запуске игры, до того как игрок что-то увидит. На мобильной сети это секунды пустого
#      ожидания. Долгий кэш безопасен: _client/src/modules/asset-version.js подставляет ко всем
#      URL картинок ?asset_v=<версия бандла>, а версия поднимается на каждом деплое (шаг 3
#      workflow в CLAUDE.md) — при обновлении арта URL меняется и кэш сбрасывается сам.
#   2) PNG для этой графики весит в 5-6 раз больше нужного: 171 МБ используемых картинок ->
#      30 МБ в WebP (замер, tools/make_webp.py). Имена файлов в коде НЕ меняются — если
#      браузер прислал "Accept: image/webp", nginx отдаёт "файл.png.webp" под тем же URL;
#      если не прислал (старый клиент) — прежний PNG. Content-Type проставится по расширению
#      реально отданного файла, браузер ориентируется на него, а не на URL.
#
# Порядок применения:
#   1. Залить .webp-файлы рядом с PNG (их делает tools/make_webp.py) в ОБА пути:
#      /var/www/stalker/client/ver0_41/images/ и .../development/images/
#   2. Блок map — в http-секцию (nginx.conf или conf.d/*.conf, ВНЕ server{}).
#   3. Блок location — в server{} для pripyat-game.ru.
#   4. НАЙТИ И УБРАТЬ существующий источник "Cache-Control: no-cache" для картинок (скорее
#      всего глобальный add_header на весь сайт) — иначе он продолжит действовать. Заголовки
#      HTML-страницы и libs/index.js трогать НЕ НАДО: index.html обязан оставаться
#      неккэшируемым, иначе игроки не увидят новую версию.
#   5. nginx -t && systemctl reload nginx
#   6. Проверить: bash tools/check_images_headers.sh

# --- в http { } ---
map $http_accept $webp_suffix {
    default        "";
    "~*image/webp" ".webp";
}

# --- в server { } для pripyat-game.ru ---
location ~* ^/client/ver0_41/(development/)?images/.+\.png$ {
    add_header Vary "Accept";
    add_header Cache-Control "public, max-age=31536000, immutable";
    expires 1y;
    # Сначала пробуем WebP-двойник, если браузер его принимает; иначе — исходный PNG.
    try_files $uri$webp_suffix $uri =404;
}
