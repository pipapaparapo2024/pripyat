# Include inside the HTTPS server block for pripyat-game-site.ru.
location = /rewards-admin/purchases.php {
    auth_basic "Pripyat TEST rewards";
    auth_basic_user_file /etc/nginx/.htpasswd-pripyat-rewards-test;
    include /etc/nginx/fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/pripyat-site/app/rewardspurchases.php;
    fastcgi_param REMOTE_USER $remote_user;
    fastcgi_param PRIPYAT_REWARDS_PURCHASES 1;
    fastcgi_pass unix:/run/php/php8.5-fpm-site-test.sock;
}
location = /donations { return 404; }
location ^~ /donations/ { return 404; }
