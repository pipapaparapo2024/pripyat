<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><link rel="icon" href="/assets/favicon.jpg"><title>Припять — вход и регистрация</title><link rel="stylesheet" href="/style.css?v=20261104-8"></head><body class="account-page"><main><header>☢ ПРИПЯТЬ</header><section><h1>Вход в игру</h1><p>Войдите в свой аккаунт или начните регистрацию.</p><nav id="auth-tabs"><button type="button" id="show-login">Войти</button><button type="button" id="show-register">Регистрация</button></nav><form id="account"><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Пароль<input name="password" type="password" autocomplete="current-password" minlength="10" maxlength="256" required></label><button name="action" value="login">Войти в игру</button><button type="button" id="show-recovery" class="secondary-action">Забыли пароль?</button></form><form id="registration" hidden><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Аватар игрока<input id="avatar-file" type="file" accept="image/jpeg,image/png,image/webp"><small>До 2 МБ. Фото обрезается по центру до квадрата.</small><img id="avatar-preview" alt="Предпросмотр аватара" hidden width="96" height="96"></label><p>Сначала подтвердите почту по ссылке из письма. Затем создайте пароль и подтвердите телефон.</p><button>Отправить письмо подтверждения</button></form><form id="recovery" hidden><label>Email аккаунта<input name="email" type="email" autocomplete="email" required></label><button>Отправить ссылку для смены пароля</button><button type="button" id="back-login" class="secondary-action">Вернуться ко входу</button></form><form id="reset" hidden><label>Новый пароль<input name="password" type="password" autocomplete="new-password" minlength="10" maxlength="256" required></label><button>Сохранить пароль</button></form><p id="result" role="status" aria-live="polite"></p><form id="phone" hidden><label>Подтвердите номер телефона<input name="phone" type="tel" autocomplete="tel" placeholder="Номер с кодом страны: +7, +375, +44…" maxlength="40" required><small>Введите номер с + и кодом страны. Подтверждение доступно для номеров, которые поддерживает Zvonok.</small></label><button>Получить номер для звонка</button></form><div id="call" hidden><p>Позвоните со своего телефона на <a id="call-number"></a></p><button id="check">Проверить звонок</button></div><a href="/">На главную</a><small><a href="/offer/">Оферта</a> · <a href="/data/">Хранение и удаление данных</a></small></section></main><script src="/account/account.js?v=20261104-8" defer></script></body></html>
